name: Auto Generate Matrimonial Article

on:
  schedule:
    # Runs once per week on Sunday at 02:30 UTC (08:00 AM IST)
    - cron: '30 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab whenever needed

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate AI Matrimonial Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
        run: |
          node scripts/generate-article.mjs

      - name: Verify SSG Build & Integrity
        run: |
          npm run build
          node scripts/verify_empirical.mjs

      - name: Commit and Push New Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles/ scripts/.article-progress.json
          if git diff --staged --quiet; then
            echo "No new article generated. Exiting."
            exit 0
          fi
          git commit -m "chore(blog): auto-generate matrimonial article via Gemini AI [skip ci]"
          git push origin main
